log_level = "info"

[router]
host = "172.16.0.1"
protocol = "http"
username = "monitor"
password = "Monitor5103"

[monitor]
interval = 15
max_retries = 4
recovery_method = "reload"

[monitor.internet]
url = "https://www.gstatic.com/generate_204"
timeout = 10
# interval = 15
# max_retries = 4

[monitor.signal]
enabled = true
# interval = 15
require_5g = true
min_5g_rsrp = -110
max_retries = 2

[action.reboot]
min_interval = 3600
wait_after = 60

[action.reload]
switch_wait = 15
restore_wait = 15

[telemetry]
service_name = "zyxel-nr5103-monitor"
endpoint = "http://localhost:4317"
export_interval = 60

[telemetry.metrics]
enabled = false
