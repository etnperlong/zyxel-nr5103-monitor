name: Release package artifact
description: Package and upload a release artifact for a built target

inputs:
  version:
    description: Release version without the v prefix
    required: true
  target:
    description: Rust target triple
    required: true
  package_os:
    description: Normalized artifact OS name
    required: true
  package_arch:
    description: Normalized artifact architecture name
    required: true
  package_variant:
    description: Optional architecture variant suffix such as v7
    required: true
  archive_ext:
    description: Archive extension to create
    required: true
  bin_suffix:
    description: Binary suffix such as .exe
    required: true
  binary_name:
    description: Binary file name without suffix
    required: true

runs:
  using: composite
  steps:
    - name: Package tar.gz archive
      if: ${{ inputs.archive_ext == 'tar.gz' }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        TARGET: ${{ inputs.target }}
        PACKAGE_OS: ${{ inputs.package_os }}
        PACKAGE_ARCH: ${{ inputs.package_arch }}
        PACKAGE_VARIANT: ${{ inputs.package_variant }}
        BIN_SUFFIX: ${{ inputs.bin_suffix }}
        BINARY_NAME: ${{ inputs.binary_name }}
      run: |
        package_name="${BINARY_NAME}_${VERSION}_${PACKAGE_OS}_${PACKAGE_ARCH}${PACKAGE_VARIANT}"
        stage_dir="${RUNNER_TEMP}/${package_name}"

        rm -rf "$stage_dir"
        mkdir -p "$stage_dir" dist

        cp "target/${TARGET}/release/${BINARY_NAME}${BIN_SUFFIX}" "$stage_dir/"
        cp README.md README_ZH.md LICENSE config.example.toml "$stage_dir/"

        tar -C "$RUNNER_TEMP" -czf "dist/${package_name}.tar.gz" "$package_name"

    - name: Package zip archive
      if: ${{ inputs.archive_ext == 'zip' }}
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
        TARGET: ${{ inputs.target }}
        PACKAGE_OS: ${{ inputs.package_os }}
        PACKAGE_ARCH: ${{ inputs.package_arch }}
        PACKAGE_VARIANT: ${{ inputs.package_variant }}
        BIN_SUFFIX: ${{ inputs.bin_suffix }}
        BINARY_NAME: ${{ inputs.binary_name }}
      run: |
        $packageName = "${env:BINARY_NAME}_${env:VERSION}_${env:PACKAGE_OS}_${env:PACKAGE_ARCH}${env:PACKAGE_VARIANT}"
        $stageDir = Join-Path $env:RUNNER_TEMP $packageName
        $binaryPath = Join-Path (Join-Path (Join-Path 'target' $env:TARGET) 'release') ("{0}{1}" -f $env:BINARY_NAME, $env:BIN_SUFFIX)

        if (Test-Path $stageDir) {
          Remove-Item $stageDir -Recurse -Force
        }

        New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
        New-Item -ItemType Directory -Force -Path dist | Out-Null

        Copy-Item $binaryPath $stageDir
        Copy-Item README.md, README_ZH.md, LICENSE, config.example.toml $stageDir

        Compress-Archive -Path (Join-Path $stageDir '*') -DestinationPath "dist/${packageName}.zip" -Force

    - name: Upload packaged artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ inputs.target }}
        path: dist/*.${{ inputs.archive_ext }}
        if-no-files-found: error
